name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Set Android version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(echo "$GITHUB_REF_NAME" | sed 's/^v//')
          APP_VERSION="$VERSION" node -e "const fs=require('fs'); const file='app.json'; const config=JSON.parse(fs.readFileSync(file,'utf8')); config.expo.version=process.env.APP_VERSION; config.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER); fs.writeFileSync(file, JSON.stringify(config, null, 2)+'\n')"

      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production --non-interactive --wait --json > eas-build.json

      - name: Download generated APK
        shell: bash
        run: |
          APK_URL=$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const build=Array.isArray(value)?value[0]:value; process.stdout.write(build.artifacts?.buildUrl || build.buildUrl || '')")
          test -n "$APK_URL"
          curl --fail --location "$APK_URL" --output "registro-financeiro-$GITHUB_REF_NAME.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: registro-financeiro-${{ github.ref_name }}
          path: registro-financeiro-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "registro-financeiro-$GITHUB_REF_NAME.apk" --generate-notes --title "Registro Financeiro $GITHUB_REF_NAME"
